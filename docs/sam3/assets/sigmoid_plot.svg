<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white" />
  
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Axes -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="black" stroke-width="2" /> <!-- x-axis -->
  <line x1="300" y1="350" x2="300" y2="50" stroke="black" stroke-width="2" /> <!-- y-axis -->
  
  <!-- Dashed lines for 0, 0.5, 1 -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="gray" stroke-dasharray="5,5" /> <!-- y=0.5 -->
  <line x1="50" y1="50" x2="550" y2="50" stroke="gray" stroke-dasharray="5,5" /> <!-- y=1.0 -->

  <!-- Sigmoid Curve -->
  <!-- Manually approximated cubic bezier for sigmoid shape -->
  <path d="M 50 349.2 
           C 150 349 200 340 250 290 
           C 275 265 290 230 300 200
           C 310 170 325 135 350 110
           C 400 60 450 51 550 50.8"
        fill="none" stroke="#2196F3" stroke-width="4" />

  <!-- Labels -->
  <text x="500" y="380" font-family="Arial" font-size="14">Logits (Values &lt; 0 and &gt; 0)</text>
  <text x="180" y="40" font-family="Arial" font-size="14">Probability (0 to 1)</text>
  
  <text x="30" y="355" font-family="Arial" font-size="12">0</text>
  <text x="25" y="205" font-family="Arial" font-size="12">0.5</text>
  <text x="25" y="55" font-family="Arial" font-size="12">1.0</text>
  
  <text x="295" y="370" font-family="Arial" font-size="12">0</text>
  
  <!-- Annotations showing mapping -->
  <circle cx="200" cy="340" r="4" fill="red" />
  <text x="150" y="330" font-family="Arial" font-size="12" fill="red">-5 -&gt; ~0.006</text>
  
  <circle cx="400" cy="60" r="4" fill="red" />
  <text x="410" y="80" font-family="Arial" font-size="12" fill="red">5 -&gt; ~0.993</text>
  
  <circle cx="300" cy="200" r="4" fill="red" />
  <text x="310" y="220" font-family="Arial" font-size="12" fill="red">0 -&gt; 0.5</text>

  <!-- Title -->
  <text x="220" y="30" font-family="Arial" font-size="20" font-weight="bold">Sigmoid Function</text>
</svg>
